<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A little surprise 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- design tokens ----------
     Soft pastel kawaii, dreamy.
     blush #FFE3EC | peach #FFF4E8 | lavender #EDE4FF | mint #DFF6F0
     rose accent #FF7FA8 / deep #FF5E92 | lavender accent #B79CED
     butter #FFD98E (sparkles) | text plum #6B4A6E
  */
  :root{
    --blush:#FFE3EC; --peach:#FFF4E8; --lav:#EDE4FF; --mint:#DFF6F0;
    --rose:#FF7FA8; --rose-deep:#FF5E92; --lav-acc:#B79CED;
    --butter:#FFD98E; --plum:#6B4A6E; --plum-soft:#9B7B9E;
    --card:#FFFDFB;
    --shadow:0 18px 40px -12px rgba(183,156,237,.45);
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--plum);
    overflow:hidden;
    touch-action:manipulation;
    background:linear-gradient(160deg,var(--lav) 0%, var(--blush) 42%, var(--peach) 100%);
  }
  #app{position:fixed; inset:0; overflow:hidden;}

  /* soft drifting blobs for dreamy depth */
  .blob{position:absolute; border-radius:50%; filter:blur(8px); opacity:.55; pointer-events:none; z-index:0;}
  .b1{width:46vmin;height:46vmin;background:#FFD7E6; top:-14vmin; left:-10vmin;}
  .b2{width:40vmin;height:40vmin;background:#D8EBFF; bottom:-12vmin; right:-8vmin;}
  .b3{width:30vmin;height:30vmin;background:#FFF0C9; top:30%; right:-6vmin;}

  .screen{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    opacity:0; visibility:hidden; transform:translateY(8px);
    transition:opacity .6s ease, transform .6s ease, visibility .6s;
  }
  .screen.active{opacity:1; visibility:visible; transform:none;}

  /* ---------- intro ---------- */
  .eyebrow{
    font-family:"Fredoka"; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
    font-size:.72rem; color:var(--lav-acc); margin:0 0 10px;
  }
  .title{
    font-family:"Fredoka"; font-weight:700; color:var(--rose-deep);
    font-size:clamp(2.6rem,12vw,4.4rem); line-height:.95; margin:0;
    text-shadow:0 3px 0 #fff, 0 10px 24px rgba(255,94,146,.28);
  }
  .title small{display:block; font-size:.42em; color:var(--plum); font-weight:600; margin-top:.5em; letter-spacing:0;}
  .lede{
    max-width:22rem; margin:18px auto 30px; font-size:1.06rem; font-weight:600; color:var(--plum-soft);
  }
  .btn{
    font-family:"Fredoka"; font-weight:600; font-size:1.15rem; color:#fff;
    border:none; cursor:pointer; padding:16px 38px; border-radius:999px;
    background:linear-gradient(180deg,var(--rose) 0%, var(--rose-deep) 100%);
    box-shadow:0 10px 0 #E14C7F, 0 18px 30px -8px rgba(255,94,146,.6);
    transition:transform .12s ease, box-shadow .12s ease;
    touch-action:manipulation;
  }
  .btn:active{transform:translateY(6px); box-shadow:0 4px 0 #E14C7F, 0 10px 18px -8px rgba(255,94,146,.6);}
  .btn:focus-visible{outline:3px solid var(--lav-acc); outline-offset:3px;}
  .btn-ghost{
    background:#fff; color:var(--rose-deep); box-shadow:0 8px 0 #F3D7E2, 0 14px 24px -10px rgba(183,156,237,.5);
  }
  .btn-ghost:active{box-shadow:0 3px 0 #F3D7E2;}

  .mute{
    position:absolute; top:14px; right:14px; z-index:30;
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:#ffffffcc; box-shadow:var(--shadow); font-size:1.2rem; line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- game ---------- */
  #screen-game{justify-content:flex-start; padding:0;}
  #hud{
    width:100%; padding:16px 18px calc(10px + env(safe-area-inset-top)); z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:linear-gradient(180deg,#ffffffcc, #ffffff00);
  }
  #hint{font-family:"Fredoka"; font-weight:500; font-size:.95rem; color:var(--plum-soft);}
  #pips{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:90%;}
  .pip{width:16px;height:16px; transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .pip svg{display:block;width:100%;height:100%;}
  .pip.off{opacity:.32; transform:scale(.8);}
  .pip.on{transform:scale(1);}
  #count{font-family:"Fredoka"; font-weight:600; color:var(--rose-deep); font-size:1rem;}

  #game-area{
    position:relative; flex:1; width:100%; overflow:hidden;
    touch-action:none; z-index:4; cursor:grab;
  }
  #game-area:active{cursor:grabbing;}
  .heart{position:absolute; will-change:transform; pointer-events:none; top:0; left:0;}
  .heart svg{display:block;}
  #cloud{position:absolute; bottom:18px; left:0; width:128px; will-change:transform; pointer-events:none; z-index:5; transition:transform .04s linear;}
  #cloud svg{display:block; width:100%; filter:drop-shadow(0 10px 14px rgba(120,140,200,.3));}

  .pop{position:absolute; pointer-events:none; font-family:"Fredoka"; font-weight:700; color:var(--rose-deep); font-size:1.1rem; z-index:7; animation:pop .6s ease forwards;}
  @keyframes pop{0%{opacity:1;transform:translate(-50%,0) scale(.6);}100%{opacity:0;transform:translate(-50%,-46px) scale(1.1);}}

  /* ---------- surprise ---------- */
  #screen-surprise{background:linear-gradient(170deg,#FFE7F1 0%, #EFE6FF 55%, #FFF3E6 100%);}
  .card{
    background:var(--card); border-radius:30px; padding:34px 26px; max-width:24rem; width:100%;
    box-shadow:var(--shadow); border:3px solid #fff; position:relative; z-index:5;
  }
  .card::before{content:"🎀"; position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:2rem;}
  .note{font-family:"Caveat"; font-weight:600; color:var(--plum); font-size:1.5rem; line-height:1.5;}
  .note p{margin:0 0 10px; opacity:0; transform:translateY(8px); animation:rise .7s ease forwards;}
  @keyframes rise{to{opacity:1; transform:none;}}
  .ask{
    font-family:"Fredoka"; font-weight:700; color:var(--rose-deep);
    font-size:clamp(1.5rem,6.5vw,2rem); margin:18px 0 4px; line-height:1.15;
    opacity:0; animation:rise .7s ease forwards;
  }
  #answers{position:relative; height:120px; margin-top:14px;}
  #btn-yes{
    font-family:"Fredoka"; font-weight:700; font-size:1.3rem; color:#fff; border:none; cursor:pointer;
    padding:16px 40px; border-radius:999px; background:linear-gradient(180deg,#FF8FB6,#FF4F86);
    box-shadow:0 9px 0 #E03B72, 0 16px 28px -8px rgba(255,79,134,.6);
    position:absolute; left:50%; top:8px; transform:translateX(-50%);
    transition:transform .15s ease, font-size .2s ease, padding .2s ease;
  }
  #btn-yes:active{transform:translateX(-50%) translateY(6px);}
  #btn-no{
    font-family:"Fredoka"; font-weight:600; font-size:1rem; color:var(--plum-soft); cursor:pointer;
    padding:11px 24px; border-radius:999px; background:#fff; border:2px solid #EDD9E4;
    position:absolute; right:14px; bottom:8px; transition:all .18s ease;
  }

  /* ---------- yes / finale ---------- */
  #screen-yes{background:linear-gradient(160deg,#FFD9E7 0%, #E9DBFF 60%, #FFEFD6 100%);}
  .finale{font-family:"Fredoka"; font-weight:700; color:var(--rose-deep); font-size:clamp(2.2rem,11vw,3.6rem); margin:0; text-shadow:0 3px 0 #fff;}
  .finale-sub{max-width:20rem; margin:14px auto 26px; font-weight:700; color:var(--plum); font-size:1.1rem;}
  .ring{font-size:3.4rem; display:inline-block; animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-12px) rotate(6deg);}}

  .confetti{position:absolute; top:-20px; pointer-events:none; z-index:8; will-change:transform;}

  /* floating ambient hearts on intro */
  .float{position:absolute; bottom:-40px; z-index:1; opacity:.7; pointer-events:none; animation:floatUp linear infinite;}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0;}10%{opacity:.7;}100%{transform:translateY(-115vh) rotate(40deg);opacity:0;}}

  @media (prefers-reduced-motion: reduce){
    .float,.ring{animation:none;}
    .screen{transition:opacity .2s;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <button class="mute" id="mute" aria-label="Toggle sound">🔊</button>

  <!-- INTRO -->
  <section class="screen active" id="screen-intro">
    <p class="eyebrow">a tiny gift, just for you</p>
    <h1 class="title">For You<small>made with my whole heart 💕</small></h1>
    <p class="lede">Catch the falling hearts in your fluffy little cloud, my love. A sweet surprise is waiting for you at the very end. 💖</p>
    <button class="btn" id="btn-start">Play&nbsp;🌸</button>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game">
    <div id="hud">
      <div id="hint">Drag anywhere to float your cloud and catch the hearts ☁️💕</div>
      <div id="pips"></div>
      <div id="count">0 / 12 hearts</div>
    </div>
    <div id="game-area">
      <div id="cloud">
        <svg viewBox="0 0 128 86" aria-hidden="true">
          <g>
            <ellipse cx="40" cy="52" rx="34" ry="30" fill="#fff"/>
            <ellipse cx="88" cy="52" rx="34" ry="30" fill="#fff"/>
            <ellipse cx="64" cy="40" rx="34" ry="32" fill="#fff"/>
            <rect x="10" y="50" width="108" height="30" rx="15" fill="#fff"/>
            <circle cx="50" cy="48" r="4.5" fill="#6B4A6E"/>
            <circle cx="78" cy="48" r="4.5" fill="#6B4A6E"/>
            <ellipse cx="40" cy="58" rx="7" ry="4" fill="#FFB6C9" opacity=".8"/>
            <ellipse cx="88" cy="58" rx="7" ry="4" fill="#FFB6C9" opacity=".8"/>
            <path d="M58 56 q6 6 12 0" stroke="#6B4A6E" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>
  </section>

  <!-- SURPRISE -->
  <section class="screen" id="screen-surprise">
    <div class="card">
      <div class="note" id="note"></div>
      <h2 class="ask" id="ask" style="animation-delay:0s"></h2>
      <div id="answers">
        <button id="btn-yes">Yes&nbsp;💍</button>
        <button id="btn-no">No</button>
      </div>
    </div>
  </section>

  <!-- YES -->
  <section class="screen" id="screen-yes">
    <div class="ring">💍</div>
    <h1 class="finale" id="finale-title">She said YES! 💖</h1>
    <p class="finale-sub" id="finale-sub"></p>
    <button class="btn btn-ghost" id="btn-replay">Play again&nbsp;🌸</button>
  </section>
</div>

<script>
/* =====================================================================
   PERSONALIZE HERE  ::  change any of these lines and that's it.
   ===================================================================== */
const CONFIG = {
  name: "Shougi",
  target: 12,                 // hearts needed to win the game
  noteLines: [                // the handwritten love note (each = one line)
    "My sweet Shougi,",
    "every little heart you caught",
    "is one I feel for you,",
    "and there are still so many more",
    "than any cloud could ever hold.",
    "You are my favorite hello,",
    "my softest place to land,",
    "and my forever person. 🥰"
  ],
  question: "Will you be mine forever, Shougi?",
  finaleTitle: "She said YES! 💖",
  finaleSub: "Forever starts right now, just you and me. I love you more than all the hearts in the sky, Shougi. 💕"
};
/* ===================================================================== */

const $ = (s)=>document.querySelector(s);
const screens = { intro:$("#screen-intro"), game:$("#screen-game"), surprise:$("#screen-surprise"), yes:$("#screen-yes") };
function show(name){ Object.values(screens).forEach(s=>s.classList.remove("active")); screens[name].classList.add("active"); }

/* ---------- tiny safe sound ---------- */
let actx=null, muted=false;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq, dur=0.12, type="sine", vol=0.18){
  if(muted) return; const a=audio(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function melody(notes){ if(muted) return; notes.forEach((n,i)=>setTimeout(()=>beep(n,0.18,"triangle",0.2), i*150)); }
$("#mute").addEventListener("click", ()=>{ muted=!muted; $("#mute").textContent = muted?"🔇":"🔊"; if(!muted) beep(660,0.08); });

/* ---------- kawaii heart svg ---------- */
const HEART_COLORS=["#FF8FB6","#FFB1C8","#C9A7F5","#9FD8FF","#FFC98E","#A8E6CF","#FF9FB0"];
function heartSVG(size,color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <path d="M50 88 C12 60 6 36 22 22 C34 11 48 18 50 30 C52 18 66 11 78 22 C94 36 88 60 50 88 Z" fill="${color}"/>
    <circle cx="38" cy="46" r="4" fill="#5A3E5E"/><circle cx="62" cy="46" r="4" fill="#5A3E5E"/>
    <circle cx="39.5" cy="44.5" r="1.3" fill="#fff"/><circle cx="63.5" cy="44.5" r="1.3" fill="#fff"/>
    <ellipse cx="30" cy="54" rx="5" ry="3" fill="#fff" opacity=".5"/>
    <ellipse cx="70" cy="54" rx="5" ry="3" fill="#fff" opacity=".5"/>
    <path d="M44 56 q6 5 12 0" stroke="#5A3E5E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- intro ambient floaters ---------- */
function spawnFloaters(){
  for(let i=0;i<10;i++){
    const f=document.createElement("div"); f.className="float";
    const s=18+Math.random()*22;
    f.innerHTML=heartSVG(s,HEART_COLORS[i%HEART_COLORS.length]);
    f.style.left=Math.random()*100+"%";
    f.style.animationDuration=(7+Math.random()*7)+"s";
    f.style.animationDelay=(-Math.random()*8)+"s";
    screens.intro.appendChild(f);
  }
}
spawnFloaters();

/* ---------- build pips ---------- */
const pipsEl=$("#pips");
function buildPips(){
  pipsEl.innerHTML="";
  for(let i=0;i<CONFIG.target;i++){
    const p=document.createElement("div"); p.className="pip off";
    p.innerHTML=heartSVG(16,"#FF7FA8"); pipsEl.appendChild(p);
  }
}
buildPips();

/* ===================== GAME ===================== */
const area=$("#game-area"), cloud=$("#cloud"), countEl=$("#count");
let W=0,H=0, cloudW=128, cloudX=0, targetX=0;
let hearts=[], caught=0, running=false, raf=null;
let lastSpawn=0, spawnGap=900, lastT=0;

function measure(){ const r=area.getBoundingClientRect(); W=r.width; H=r.height; cloudW=cloud.offsetWidth||128; cloudX=Math.min(Math.max(cloudX||W/2,cloudW/2),W-cloudW/2); targetX=cloudX; }
window.addEventListener("resize", ()=>{ if(running) measure(); });

function setCloud(x){ cloudX=Math.min(Math.max(x,cloudW/2),W-cloudW/2); cloud.style.transform=`translateX(${cloudX-cloudW/2}px)`; }

function pointerX(e){ const r=area.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); return cx-r.left; }
function onMove(e){ if(!running) return; targetX=pointerX(e); }
area.addEventListener("pointermove", onMove, {passive:true});
area.addEventListener("pointerdown", onMove, {passive:true});
area.addEventListener("touchmove", (e)=>{ onMove(e); e.preventDefault(); }, {passive:false});

function spawnHeart(){
  const size=40+Math.random()*22;
  const el=document.createElement("div"); el.className="heart";
  el.innerHTML=heartSVG(size,HEART_COLORS[Math.floor(Math.random()*HEART_COLORS.length)]);
  area.appendChild(el);
  hearts.push({ el, x:size/2+Math.random()*(W-size), y:-size, size, vy:90+Math.random()*70 });
}

function popText(x,y){
  const p=document.createElement("div"); p.className="pop"; p.textContent="+1 💗";
  p.style.left=x+"px"; p.style.top=y+"px"; area.appendChild(p);
  setTimeout(()=>p.remove(),600);
}

function fillPip(n){ const p=pipsEl.children[n-1]; if(p){ p.classList.remove("off"); p.classList.add("on"); } }

function loop(t){
  if(!running) return;
  if(!lastT) lastT=t; const dt=Math.min((t-lastT)/1000,0.05); lastT=t;
  // smooth cloud follow
  setCloud(cloudX + (targetX-cloudX)*0.35);
  // spawn
  if(t-lastSpawn>spawnGap){ spawnHeart(); lastSpawn=t; spawnGap=Math.max(480, spawnGap-12); }
  const cloudCenter=cloudX, cloudTop=H-cloud.offsetHeight-18, catchR=cloudW*0.46;
  for(let i=hearts.length-1;i>=0;i--){
    const h=hearts[i]; h.y+=h.vy*dt; h.el.style.transform=`translate(${h.x-h.size/2}px,${h.y}px)`;
    const hc=h.y+h.size*0.5;
    if(hc>=cloudTop && hc<=cloudTop+50 && Math.abs(h.x-cloudCenter)<catchR+h.size*0.3){
      h.el.remove(); hearts.splice(i,1); caught++; beep(520+caught*18,0.1,"sine",0.16);
      countEl.textContent=`${caught} / ${CONFIG.target} hearts`; fillPip(caught);
      popText(h.x, cloudTop);
      if(caught>=CONFIG.target){ endGame(); return; }
    } else if(h.y>H+h.size){ h.el.remove(); hearts.splice(i,1); }
  }
  raf=requestAnimationFrame(loop);
}

function startGame(){
  show("game"); caught=0; spawnGap=900; lastSpawn=0; lastT=0;
  hearts.forEach(h=>h.el.remove()); hearts=[];
  buildPips(); countEl.textContent=`0 / ${CONFIG.target} hearts`;
  requestAnimationFrame(()=>{ measure(); setCloud(W/2); targetX=W/2; running=true; raf=requestAnimationFrame(loop); });
}
function endGame(){ running=false; cancelAnimationFrame(raf); beep(880,0.18,"triangle",0.2); setTimeout(playSurprise,500); }

/* ===================== SURPRISE ===================== */
function playSurprise(){
  // burst of hearts leaving the game
  for(let i=0;i<14;i++){ setTimeout(()=>confettiOne(screens.game),i*30); }
  setTimeout(()=>{
    const note=$("#note"); note.innerHTML="";
    CONFIG.noteLines.forEach((line,i)=>{ const p=document.createElement("p"); p.textContent=line; p.style.animationDelay=(0.25+i*0.55)+"s"; note.appendChild(p); });
    const ask=$("#ask"); ask.textContent=CONFIG.question; ask.style.animationDelay=(0.4+CONFIG.noteLines.length*0.55)+"s";
    const ans=$("#answers"); ans.style.opacity=0; ans.style.transition="opacity .6s ease";
    show("surprise"); melody([523,587,659,784]);
    setTimeout(()=>{ ans.style.opacity=1; }, (0.7+CONFIG.noteLines.length*0.55)*1000);
    petals(screens.surprise);
  }, 650);
}

/* gentle petals on surprise screen */
let petalTimer=null;
function petals(parent){
  clearInterval(petalTimer);
  petalTimer=setInterval(()=>{
    if(!screens.surprise.classList.contains("active")){ clearInterval(petalTimer); return; }
    const f=document.createElement("div"); f.className="float"; f.style.zIndex=1;
    const s=16+Math.random()*16; f.innerHTML=heartSVG(s,HEART_COLORS[Math.floor(Math.random()*HEART_COLORS.length)]);
    f.style.left=Math.random()*100+"%"; f.style.animationDuration=(6+Math.random()*5)+"s";
    parent.appendChild(f); setTimeout(()=>f.remove(),11000);
  },650);
}

/* dodging "No" button */
const btnNo=$("#btn-no"), btnYes=$("#btn-yes"), answers=$("#answers");
let dodges=0; const pleas=["No","nope~","hee hee, no","are you sure?","pretty please?","you can't catch me 🥺","just say yes! 💕"];
function dodge(){
  dodges++;
  const ar=answers.getBoundingClientRect(), bw=btnNo.offsetWidth, bh=btnNo.offsetHeight;
  const maxX=Math.max(0,ar.width-bw), maxY=Math.max(0,ar.height-bh);
  btnNo.style.left=Math.random()*maxX+"px"; btnNo.style.top=Math.random()*maxY+"px"; btnNo.style.right="auto"; btnNo.style.bottom="auto";
  btnNo.textContent=pleas[Math.min(dodges,pleas.length-1)];
  const scale=Math.max(0.55,1-dodges*0.08); btnNo.style.transform=`scale(${scale})`;
  const yScale=Math.min(1.5,1+dodges*0.08); btnYes.style.fontSize=(1.3*yScale)+"rem";
  beep(300+Math.random()*120,0.07,"square",0.1);
}
btnNo.addEventListener("pointerenter", dodge);
btnNo.addEventListener("pointerdown", (e)=>{ e.preventDefault(); dodge(); });
btnNo.addEventListener("click",(e)=>{ e.preventDefault(); dodge(); });
btnYes.addEventListener("click", saidYes);

/* ===================== FINALE ===================== */
function saidYes(){
  clearInterval(petalTimer);
  $("#finale-title").textContent=CONFIG.finaleTitle;
  $("#finale-sub").textContent=CONFIG.finaleSub;
  show("yes"); melody([523,659,784,1047,1319]);
  for(let i=0;i<60;i++){ setTimeout(()=>confettiOne(screens.yes,true),i*40); }
}
function confettiOne(parent, big){
  const c=document.createElement("div"); c.className="confetti";
  const s=(big?20:16)+Math.random()*16;
  c.innerHTML=heartSVG(s,HEART_COLORS[Math.floor(Math.random()*HEART_COLORS.length)]);
  const startX=Math.random()*100; c.style.left=startX+"vw"; c.style.top="-30px";
  parent.appendChild(c);
  const dur=2200+Math.random()*1800, drift=(Math.random()*2-1)*30, rot=(Math.random()*2-1)*540;
  const anim=c.animate([
    {transform:`translate(0,0) rotate(0)`, opacity:1},
    {transform:`translate(${drift}vw, 110vh) rotate(${rot}deg)`, opacity:.9}
  ],{duration:dur, easing:"cubic-bezier(.3,.1,.6,1)"});
  anim.onfinish=()=>c.remove();
}

/* ---------- wire up ---------- */
$("#btn-start").addEventListener("click", ()=>{ audio(); if(actx&&actx.state==="suspended") actx.resume(); beep(660,0.1); startGame(); });
$("#btn-replay").addEventListener("click", ()=>{ dodges=0; btnNo.style.cssText=""; btnYes.style.fontSize=""; show("intro"); });
</script>
